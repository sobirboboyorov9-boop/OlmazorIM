[build]
  base      = "."
  publish   = "artifacts/alberuni/dist/public"
  command   = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/alberuni run build"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"

[functions]
  directory     = "netlify/functions"
  node_bundler  = "esbuild"

# ─── API → Netlify Function ───────────────────────────────────────────────────
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true

# ─── SPA catch-all (page not found muammosini hal qiladi) ────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
